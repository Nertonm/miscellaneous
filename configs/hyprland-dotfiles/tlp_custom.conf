# ------------------------------------------------------------------------------
# TLP Configuração Otimizada (Modo Bateria Extrema)
# ------------------------------------------------------------------------------

# Ativa o TLP
TLP_ENABLE=1

# --- CPU & Performance ---

# Na tomada: Desempenho máximo e Turbo Boost liberado
CPU_SCALING_GOVERNOR_ON_AC="performance"
CPU_ENERGY_PERF_POLICY_ON_AC="performance"
CPU_BOOST_ON_AC="1"

# Na bateria: Economia máxima, sem Turbo Boost e limitado a 1.6GHz (sua escolha)
CPU_SCALING_GOVERNOR_ON_BAT="powersave"
CPU_ENERGY_PERF_POLICY_ON_BAT="power"
CPU_BOOST_ON_BAT="0"
CPU_SCALING_MAX_FREQ_ON_BAT="1600000"

# --- Plataforma e Drivers ---

# Perfil da plataforma (Cool/Quiet/Performance)
PLATFORM_PROFILE_ON_AC="performance"
PLATFORM_PROFILE_ON_BAT="low-power"

# Gerenciamento de energia Runtime (PCIe, etc)
RUNTIME_PM_ON_AC="on"
RUNTIME_PM_ON_BAT="auto"

# ASPM (Active State Power Management) - Economia agressiva na bateria
PCIE_ASPM_ON_AC="default"
PCIE_ASPM_ON_BAT="powersupersave"

# --- USB e Dispositivos ---

# CORREÇÃO: Autosuspend deve ser 1 para economizar bateria
USB_AUTOSUSPEND=1

# Desliga o rádio (Bluetooth/Wifi) ao iniciar? (Opcional, deixei padrão)
# RESTORE_DEVICE_STATE_ON_STARTUP=1

# --- Áudio ---
# Coloca o chip de áudio para dormir após 1 segundo sem som
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- Rede ---
# Economia de energia no Wi-Fi na bateria
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ------------------------------------------------------------------------------
# Fim das configurações personalizadas
# ------------------------------------------------------------------------------
