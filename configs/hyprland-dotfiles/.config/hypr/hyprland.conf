################
### MONITORS ###
#################
monitor=eDP-1,1920x1080@165,0x0,1
monitor=HDMI-A-2,2560x1080@75,1920x0,1
#monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = kitty -e yazi
$menu = wofi --show drun --allow-images

#################
### AUTOSTART ###
#################
# 1. Sistema e Portais
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/scripts/reset-portals.sh

# 2. Autenticação (Polkit GNOME - Essencial para Sudo Gráfico)
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

# 3. Interface e Serviços
exec-once = fcitx5 -d --replace
exec-once = hyprpaper
exec-once = waybar
exec-once = hypridle
exec-once = nm-applet
exec-once = blueman-applet

# 4. Clipboard (Histórico de Cópia)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Environment Variables
# Theme and Colors
env = GTK_THEME,Breeze-Dark
env = QT_STYLE_OVERRIDE,Breeze-Dark
env = QT_QPA_PLATFORMTHEME,kde

# Força o esquema de cores escuro para portais e apps GTK4
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Breeze-Dark'

# Nvidia e Wayland
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,iHD
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Toolkit Backends
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
# env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Wayland / Electron Compatibility
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NVD_BACKEND,direct

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

#############
### INPUT ###
#############
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

xwayland {
  enabled = true
  force_zero_scaling = true
}

cursor {
    no_hardware_cursors = true
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# Alt+Tab para ciclar janelas
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1

# Mover janela para outro monitor
bind = $mainMod SHIFT, left, movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r
bind = $mainMod SHIFT, up, movewindow, mon:u
bind = $mainMod SHIFT, down, movewindow, mon:d
bind = $mainMod SHIFT, P, movewindow, mon:+1

# Áudio
bind = $mainMod, A, exec, kitty --class floating_pulsemixer -e pulsemixer

# Apps e Sistema
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/float-next.sh $menu
bind = CTRL SHIFT, D, exec, ~/.config/hypr/scripts/float-next.sh $menu
bind = ALT, F1, exec, $menu
bind = $mainMod, E, exec, $fileManager

# Clipboard Manager
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Screenshots
bind = , Print, exec, grim ~/Imagens/Screenshots/Screen_$(date +'%Y-%m-%d_%H-%M-%S').png
bind = SHIFT, Print, exec, grim - | wl-copy --type image/png
bind = CTRL, Print, exec, grim -g "$(slurp)" ~/Imagens/Screenshots/Region_$(date +'%Y-%m-%d_%H-%M-%S').png
bind = CTRL SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy --type image/png

# Sair / Matar
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod CTRL, Escape, killactive
bind = CTRL ALT, Delete, exit,

# Janelas
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, T, togglesplit,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, fullscreen, 1

# Foco (HJKL)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Mover Janela (Shift+HJKL)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Redimensionar (Ctrl+HJKL)
binde = $mainMod CTRL, L, resizeactive, 30 0
binde = $mainMod CTRL, H, resizeactive, -30 0
binde = $mainMod CTRL, K, resizeactive, 0 -30
binde = $mainMod CTRL, J, resizeactive, 0 30

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = CTRL, F1, workspace, 1
bind = CTRL, F2, workspace, 2
bind = CTRL, F3, workspace, 3
bind = CTRL, F4, workspace, 4

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Special Workspace (Scratchpad)
bind = $mainMod, Page_Down, movetoworkspace, special:magic
bind = $mainMod, Page_Up, togglespecialworkspace, magic

# Mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Mídia e Brilho
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Scripts Personalizados
bind = $mainMod, B, exec, ~/.local/bin/battery-toggle.sh
bind = CTRL SHIFT SUPER, P, exec, hyprctl monitors | grep -q "eDP-1" && hyprctl keyword monitor eDP-1,disable || hyprctl keyword monitor eDP-1,1920x1080@165,0x0,1

##############################
### WINDOW RULES ###
##############################

# NOVA SINTAXE 0.53+ - Todas as regras foram convertidas
windowrule = match:class .*, suppress_event maximize

# Regras para janelas flutuantes comuns
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(blueman-manager)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1

windowrule = match:class ^(floating_nmtui)$, float 1
windowrule = match:class ^(floating_nmtui)$, size 700 500
windowrule = match:class ^(floating_nmtui)$, center 1

windowrule = match:class ^(floating_pulsemixer)$, float 1
windowrule = match:class ^(floating_pulsemixer)$, size 800 600
windowrule = match:class ^(floating_pulsemixer)$, center 1

windowrule = match:class ^(floating_btop)$, float 1
windowrule = match:class ^(floating_btop)$, size 900 600
windowrule = match:class ^(floating_btop)$, center 1

windowrule = match:class ^(floating_bluetuith)$, float 1
windowrule = match:class ^(floating_bluetuith)$, size 700 500
windowrule = match:class ^(floating_bluetuith)$, center 1

# Correção XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, no_focus 1
