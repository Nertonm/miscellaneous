#---------------------------------------------------------------------#
#                            MAKE.CONF                                #
#                                                                     #
#  Hardware: Intel Core i7-13620H (Raptor Lake) + Nvidia RTX 3050     #
#  Ambiente: Gentoo com Systemd, Hyprland (Wayland)                   #
#---------------------------------------------------------------------#

# (1) Otimizações do Compilador
# Flags para CPU Intel Raptor Lake
COMMON_FLAGS="-O2 -pipe -march=raptorlake"
CFLAGS="${COMMON_FLAGS}"

# Flags de C++ (Herda de CFLAGS)
CXXFLAGS="${CFLAGS}"
# Flags Fortran
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Flags do Processador (Gerado por cpuid2cpuflags)
# Ativa aceleração para criptografia (AES), vetorização (AVX2), etc.
CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

# (2) Opções de Compilação Paralela
# Intel i7-13620H tem 16 threads (6P + 4E cores).
# Usamos -j14 para deixar 2 threads livres para o sistema/navegador não travar.
MAKEOPTS="-j14 -l14"

# (3) Arquitetura do Host
CHOST="x86_64-pc-linux-gnu"

# (4) USE Flags Globais
# Foco: Wayland, Pipewire, Suporte Gráfico Híbrido e Multimídia
# Adicionei suporte a qt/gtk para temas unificados
USE="extra dist-kernel systemd wayland X qt5 qt6 gtk gtk3 gtk4 pipewire vulkan dbus \
     vaapi vdpau opengl gles2 \
     bluetooth networkmanager wifi \
     ffmpeg jpeg png svg webp \
     samba cups branding \
     kde -gnome -telemetry"

# (5) Gerenciador de Boot
GRUB_PLATFORMS="efi-64"

# (6) Drivers de Vídeo (Híbrido Intel/Nvidia)
VIDEO_CARDS="intel nvidia"

# (7) Dispositivos de Entrada
INPUT_DEVICES="libinput wacom"

# (8) Idiomas
L10N="pt-BR ja"
LINGUAS="pt_BR pt ja"

# (9) Licenças
ACCEPT_LICENSE="* -@EULA @FREE @BINARY-REDISTRIBUTABLE NVIDIA-CUDA"

# (10) Recursos do Portage
# ccache: Acelera recompilação
# parallel-fetch: Baixa fontes enquanto compila
# candy: Barra de progresso bonita
# Removi distcc pois estava gerando erros de conexão
FEATURES="ccache parallel-fetch candy"

# Configuração de Cache
CCACHE_DIR="/var/cache/ccache"
