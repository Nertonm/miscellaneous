#---------------------------------------------------------------------#
#                            MAKE.CONF                                #
#                                                                     #
#  Hardware: AMD Ryzen 5 5600 (Zen 3) + AMD RX 5700 XT                #
#  Ambiente: Gentoo com Systemd, KDE Plasma 6 (Wayland)               #
#---------------------------------------------------------------------#

# (1) Otimizações do Compilador
# -march=znver3 otimiza o código especificamente para a arquitetura do seu Ryzen 5 5600 (Zen 3).
COMMON_FLAGS="-O2 -pipe -march=znver3"

# Flags para os compiladores C e C++
# -fPIE é adicionado para criar executáveis seguros (Position-Independent Executables)
CFLAGS="${COMMON_FLAGS} -fPIE"
CXXFLAGS="${COMMON_FLAGS} -fPIE"

# Flags para compiladores Fortran (herdam as flags base)
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Flags para o Linker
# -O1: Otimização do linker | --as-needed: Liga apenas bibliotecas necessárias | -pie: Cria o executável PIE
LDFLAGS="-Wl,-O1 -Wl,--as-needed -pie"

# (2) Opções de Compilação Paralela
# Ryzen 5 5600 (12 threads) + 3-4 cores de um servidor distcc
# -j16: Número total de jobs paralelos
# -l12: Carga máxima na máquina local para a manter responsiva
MAKEOPTS="-j16 -l12"

# (3) Arquitetura do Host
CHOST="x86_64-pc-linux-gnu"

# (4) USE Flags Globais
# Configurado para KDE/Wayland com máxima compatibilidade e recursos.
# X é mantido para XWayland, vaapi/vdpau para aceleração de vídeo por hardware.
# systemd`: Define o `systemd` como o sistema de init.
# kde plasma wayland qt6: O núcleo do ambiente de trabalho KDE Plasma 6 em Wayland.
# pipewire: O servidor de áudio e vídeo moderno para Linux.
# amdgpu vulkan vaapi vdpau: Ativa o suporte completo para a aceleração de gráficos e vídeo por hardware na minha GPU AMD.
USE="amdgpu dist-kernel systemd samba bluetooth cups networkmanager kde plasma wayland X qt5 qt6 pipewire vulkan dbus  vaapi vdpau xdg-portal-kde"

# (5) Gerenciador de Boot (GRUB)
# "efi-64" para sistemas UEFI (o mais comum hoje).
GRUB_PLATFORMS="efi-64"

# (6) Driver de Vídeo
# "amdgpu" é o driver open-source correto para placa amd.
VIDEO_CARDS="amdgpu radeonsi"

# (7) Dispositivos de Entrada
# libinput é o padrão moderno para teclados, mouses, etc., especialmente no Wayland.
INPUT_DEVICES="libinput"

# (8) Idiomas e Localização
L10N="pt-BR"
LINGUAS="pt_BR pt"

# (9) Licenças de Software
# Aceita licenças de software livre, binários redistribuíveis e firmwares comuns.
ACCEPT_LICENSE="* -@EULA @FREE @BINARY-REDISTRIBUTABLE linux-fw-redistributable"

# (10) Recursos do Portage
# ccache: Acelera a recompilação guardando em cache os resultados de compilações anteriores.
# distcc: Distribui os trabalhos de compilação pela rede.
# parallel-fetch: Descarrega os códigos-fonte em paralelo.
# candy: Ativa uma barra de progresso no emerge.
# buildpkg: Cria um pacote binário de tudo o que é compilado, útil para backups ou para acelerar a instalação em outras máquinas.
FEATURES="ccache distcc parallel-fetch candy buildpkg"
